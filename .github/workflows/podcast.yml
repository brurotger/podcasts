# Gera e publica o episódio semanal do podcast "IA Hoje", com as notícias
# dos últimos 7 dias.
#
# Roda toda semana aos domingos, às 09:00 UTC (06:00 no horário de Brasília).
# Também pode ser disparado manualmente na aba Actions ("Run workflow").
#
# Requisito: criar UM destes secrets em Settings -> Secrets and variables -> Actions:
#   - ANTHROPIC_API_KEY        (chave da API, paga por uso)  OU
#   - CLAUDE_CODE_OAUTH_TOKEN  (token da assinatura Pro/Max, gerado com `claude setup-token`)

name: Podcast semanal de IA

on:
  schedule:
    - cron: "0 9 * * 0"  # domingo
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Gerar episódio de teste (sem chamar a API)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  gerar-episodio:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # episódio semanal é mais longo (mais falas pra sintetizar)
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: podcast/requirements.txt

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependências
        run: pip install -r podcast/requirements.txt

      - name: Instalar Claude Code CLI (modo assinatura)
        run: npm install -g @anthropic-ai/claude-code

      - name: Gerar episódio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        working-directory: podcast
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python run_pipeline.py --dry-run
          else
            python run_pipeline.py
          fi

      - name: Publicar (commit no repositório)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "Nada para publicar hoje."
          else
            git commit -m "🎙️ Episódio de $(date -u +%F)"
            git push
          fi

      - name: Anexar MP3 como artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episodio
          path: docs/episodes/*.mp3
          if-no-files-found: ignore
          retention-days: 35  # ~5 semanas de backup, já que agora roda semanalmente
